name: AAX developer build - not retail Pro Tools compatible
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  aax:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Configure unsigned universal AAX target
        run: cmake -S . -B build-aax -DCMAKE_BUILD_TYPE=Release '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 -DIRCHOIR_BUILD_TESTS=OFF -DIRCHOIR_BUILD_AAX=ON
      - name: Compile AAX and check universal architecture
        run: |
          cmake --build build-aax --target IRChoir_AAX --parallel 3
          xcrun lipo build-aax/IRChoir_artefacts/Release/AAX/IRChoir.aaxplugin/Contents/MacOS/IRChoir -verify_arch arm64 x86_64
          mkdir -p aax-developer-output
          ditto -c -k --keepParent build-aax/IRChoir_artefacts/Release/AAX/IRChoir.aaxplugin aax-developer-output/IRChoir-AAX-UNSIGNED-DEVELOPER-ONLY.zip
          cp Documentation/PROTOOLS-AAX.txt aax-developer-output/READ-ME-FIRST.txt
          shasum -a 256 aax-developer-output/*.zip > aax-developer-output/SHA256SUMS.txt
      - name: Upload developer build - PACE signing and Pro Tools testing required
        uses: actions/upload-artifact@v4
        with:
          name: I.R.Choir-AAX-UNSIGNED-DEVELOPER-ONLY
          path: aax-developer-output/
